[project]
name = "julia-sim"
version = "1.0.0"
requires-python = ">=3.13,<3.14"
dependencies = ["numpy==2.2.5"]

[dependency-groups]
dev = ["mypy==1.19.1", "playwright==1.58.0", "ruff==0.15.0"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["web", "scripts", "tests"]
